[project]
name = "fly-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexander Sukharev",email = "suxarev.a86@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "mypy (>=2.4.1,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.mypy]
python_version = "3.13"

[tool.flake8]
max-line-length = 119